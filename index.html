<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="정보처리기사 필기 모바일 CBT - 저작권 안전 독자 예상문제">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css?v=20260821">
  <title>정보처리기사 CBT</title>
</head>
<body>
  <header class="topbar">
    <div><p class="eyebrow">정보처리기사 필기 · 모바일 문제은행</p><h1>정보처리기사 CBT</h1></div>
    <div class="timer"><span id="timer">--:--</span></div>
  </header>

  <main>
    <section id="start-screen" class="screen active">
      <div class="hero compact">
        <p class="kicker">5과목 · 4지선다 · 독자 예상문제</p>
        <h2>오늘 풀 문제를<br>직접 고르세요.</h2>
        <p>제공 자료 전체의 출제 개념과 유형을 분석해 새로 작성한 공개용 문제은행입니다. 출판사 원문 문제와 해설은 포함하지 않습니다.</p>
      </div>

      <section class="picker-card">
        <div class="section-title"><h3>회차별 모의고사</h3><span id="set-count-label"></span></div>
        <div id="set-grid" class="set-grid"></div>
        <p class="source-note">각 회차는 5과목을 고르게 포함하며 정답 위치 A/B/C/D가 균형을 이루도록 검증했습니다.</p>
      </section>

      <section class="picker-card">
        <div class="section-title"><h3>내가 골라 풀기</h3><span>필터 조합</span></div>
        <div class="filter-label">과목</div><div id="subject-picker" class="chapter-picker"></div>
        <div class="filter-label">연도</div><div id="year-picker" class="chapter-picker"></div>
        <div class="filter-label">문제 유형</div><div id="type-picker" class="chapter-picker"></div>
        <label class="select-row" for="question-count">문제 수
          <select id="question-count"><option value="10">10문제</option><option value="20" selected>20문제</option><option value="40">40문제</option><option value="100">100문제</option></select>
        </label>
        <button id="custom-start" class="primary wide">선택 범위에서 시작</button>
        <p id="filter-status" class="status"></p>
      </section>

      <div class="stack-actions">
        <button id="wrong-start" class="secondary hidden">저장된 오답 다시 풀기</button>
        <button id="resume-button" class="secondary hidden">진행 중 시험 이어 풀기</button>
      </div>
    </section>

    <section id="quiz-screen" class="screen">
      <div class="progress-row"><span id="question-number"></span><span id="answered-count"></span></div>
      <div class="progress"><div id="progress-fill"></div></div>
      <article class="question-card">
        <div class="meta"><span id="exam-name"></span><span id="subject"></span><span id="unit"></span><span id="difficulty"></span></div>
        <h2 id="question-text"></h2>
        <div id="question-layout" class="question-detail hidden"></div>
        <fieldset id="options"><legend class="sr-only">답안 선택</legend></fieldset>
      </article>
      <nav class="question-nav"><button id="prev-button" class="secondary">이전</button><button id="flag-button" class="ghost">검토</button><button id="next-button" class="primary">다음</button></nav>
      <button id="open-overview" class="overview-button">문항 전체 보기</button>
      <button id="exit-button" class="ghost danger exit-button">홈으로</button>
    </section>

    <section id="overview-screen" class="screen">
      <h2>문항 전체 보기</h2><p id="overview-summary"></p><div id="question-grid" class="question-grid"></div>
      <div class="stack-actions"><button id="return-button" class="secondary">문제로 돌아가기</button><button id="finish-button" class="primary">시험 종료 및 채점</button></div>
    </section>

    <section id="result-screen" class="screen">
      <div class="result-hero"><p id="result-label" class="kicker"></p><h2 id="result-title"></h2><p id="result-summary"></p></div>
      <div id="subject-results" class="chapter-results"></div>
      <h3>문항별 정답·해설</h3><div id="answer-review" class="wrong-answers"></div>
      <div class="stack-actions"><button id="share-button" class="primary">결과 공유</button><button id="copy-button" class="secondary">결과 복사</button><button id="download-button" class="secondary">결과 파일 저장</button><button id="reset-button" class="ghost danger">문제 선택으로</button></div>
      <p id="export-status" class="status"></p>
    </section>
  </main>

  <dialog id="finish-dialog"><h2>시험을 종료할까요?</h2><p id="finish-dialog-text"></p><div class="dialog-actions"><button id="cancel-finish" class="secondary">계속 풀기</button><button id="confirm-finish" class="primary">채점하기</button></div></dialog>
  <script src="bank.js?v=20260821"></script>
  <script src="logic.js?v=20260821"></script>
  <script src="app.js?v=20260821"></script>
</body>
</html>
